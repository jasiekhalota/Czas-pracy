<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Linii aseptycznych PET</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-96x96.png" />
    <link rel="manifest" href="site.webmanifest" />

    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 2.2rem; color: #fff; margin-bottom: 30px; }

        #save-data-btn {
            padding: 15px 30px; background: #27ae60; color: white; border: none; 
            border-radius: 8px; cursor: pointer; margin-bottom: 30px; 
            font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .groups-grid-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(650px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1800px;
        }

        .group-container {
            background-color: #1B365D;
            transition: background-color 0.5s ease; 
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid #333;
            transition: all 0.5s ease;
        }

        /* STYL DLA ZATRZYMANEJ LINII – przyciemniamy wnętrze, ale nie przycisk */
        .group-container.line-stopped .group-title,
        .group-container.line-stopped .main-start-wrapper,
        .group-container.line-stopped .timers-row,
        .group-container.line-stopped .homo-toggle-wrapper {
            filter: grayscale(1) brightness(0.2);
            opacity: 0.35;
            transition: all 0.5s ease;
        }

        /* Tło kontenera przy zatrzymaniu – neutralna czerń zamiast granatowego */
        .group-container.line-stopped {
            background-color: #1a1a1a;
            transition: background-color 0.5s ease;
        }

        /* NAGŁÓWEK KAFELKA */
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .group-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin: 0; width: 250px;}

        .main-start-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .main-start-label { font-size: 1.1rem; font-weight: bold; color: #48bb78; text-transform: uppercase; }

        input.main-date-input {
            font-size: 1.2rem; 
            padding: 8px;
            font-weight: bold;
            color: #fff;
            background: #252525;
            border: 1px solid #555;
            border-radius: 6px;
        }

        /* Przycisk STOP/START (dawniej reset) */
        .reset-btn {
            background-color: #c53030;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-left: 10px;
        }
        .reset-btn:hover { background-color: #e53e3e; }

        .start-btn { background-color: #27ae60 !important; }
        .stop-btn { background-color: #c53030 !important; }

        .timers-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

        .timer-box {
            background: #252525; 
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 230px;
            border: 1px solid #333;
        }

        .machine-desc {
            font-size: 0.75rem;
            color: #ffcc00;
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .timer-box.master { border-top: 6px solid #48bb78; }
        .timer-box.sub1 { border-top: 6px solid #ed8936; }
        .timer-box.sub2 { border-top: 6px solid #f56565; }

        .t-label { 
            font-size: 1.3rem;
            color: #a0aec0; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
        }

        .praca-do-wrapper {
            border: 2px solid #00ff00;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 6px;
        }

        .praca-do-label {
            font-size: 1.1rem;
            color: #cbd5e0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
            margin-bottom: 2px;
            font-weight: 800;
        }

        .t-footer { 
            font-size: 1.1rem; 
            color: #cbd5e0; 
            margin: 0 0 5px 0; 
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .t-value { 
            font-family: 'Consolas', monospace;
            font-size: 1.4rem; 
            font-weight: 700; 
            color: #00ff00;
            background: #121212; 
            padding: 12px 5px; 
            border-radius: 6px;
            border: 1px solid #444;
        }

        .overdue { background: #3a1313 !important; }
        .overdue .t-value { color: #ff4d4d !important; }

        input.sub-date-input { 
            background: #2d2d2d; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 8px; 
            width: 90%; 
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 5px;
        }
        
		/* Zmiana koloru ikonki kalendarza na biały dla wszystkich pól daty */
input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
    }
		
        @media (max-width: 1300px) { .groups-grid-wrapper { grid-template-columns: 1fr; } }

        /* === TOGGLE HOMO A4 === */
        .homo-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .homo-toggle-label {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #aaa;
            white-space: nowrap;
            min-width: 70px;
            text-align: center;
            transition: color 0.3s;
        }

        .homo-toggle-label.active { color: #48bb78; }

        .toggle-switch {
            position: relative;
            width: 58px;
            height: 28px;
            flex-shrink: 0;
        }

        .toggle-switch input { display: none; }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #c53030;
            border-radius: 28px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider { background: #27ae60; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(30px); }

    </style>
</head>
<body>

    <h1>System Monitorowania Cykli Produkcyjnych</h1>
    <button id="save-data-btn" onclick="saveDataToFirebase()">ZAPISZ I SYNCHRONIZUJ CZAS</button>
    
    <div class="groups-grid-wrapper"></div>

    <script>
        const CONFIG_LINII = {
            1: {
                title: "Aseptic A1 CK",
                machines: {
                    master: { label: "Rozlew CK", limit: 140, desc: "AWARYJNIE +4h MAX" },
                    sub1:   { label: "Zb. Asep. A1", limit: 85, desc: "AWARYJNIE +2h MAX" },
                    sub2:   { label: "Past. A1", limit: 41, desc: "AWARYJNIE +4h MAX" }
                }
            },
            2: {
                title: "Aseptic A2 CL",
                machines: {
                    master: { label: "Rozlew CL", limit: 140, desc: "AWARYJNIE +8h MAX" },
                    sub1:   { label: "Zb. Asep. A2", limit: 72, desc: "AWARYJNIE +5h MAX " },
                    sub2:   { label: "Past. A2", limit: 32, desc: "AWARYJNIE +2h MAX" }
                }
            },
            3: {
                title: "Aseptic A3 CM",
                machines: {
                    master: { label: "Rozlew CM", limit: 168, desc: "AWARYJNIE +10h MAX" },
                    sub1:   { label: "Zb. Asep. A3", limit: 120, desc: "WATERR 120h | RESZTA 96H" },
                    sub2:   { label: "Past. A3", limit: 38, desc: "AWARYJNIE +2h MAX" }
                }
            },
            4: {
                title: "Aseptic A4 CN",
                machines: {
                    master: { label: "Rozlew CN", limit: 168, desc: "Z homo 120h -> BEZ 168h" },
                    sub1:   { label: "Zb. Asep. A4", limit: 120, desc: "Z homo 120h -> BEZ 210h" },
                    sub2:   { label: "Past. A4", limit: 60, desc: "Z homo 40h -> BEZ 40h" }
                }
            }
        };

        // === KONFIGURACJE HOMO DLA LINII A4 ===
        const CONFIG_A4 = {
            homo: {
                master: { limit: 120, desc: "Z HOMOGENIZATOREM – MAX 120h" },
                sub1:   { limit: 120, desc: "Z HOMOGENIZATOREM – MAX 120h" },
                sub2:   { limit: 40,  desc: "Z HOMOGENIZATOREM – MAX 40h"  }
            },
            bez: {
                master: { limit: 168, desc: "BEZ HOMOGENIZATORA – MAX 168h" },
                sub1:   { limit: 210, desc: "BEZ HOMOGENIZATORA – MAX 210h" },
                sub2:   { limit: 40,  desc: "BEZ HOMOGENIZATORA – MAX 40h"  }
            }
        };

        function onHomoToggle(groupId) {
            const isHomo = !document.getElementById('homo-toggle-' + groupId).checked;
            const mode = isHomo ? 'homo' : 'bez';
            const cfg = CONFIG_A4[mode];

            // Aktualizuj CONFIG_LINII na żywo
            ['master', 'sub1', 'sub2'].forEach(type => {
                CONFIG_LINII[groupId].machines[type].limit = cfg[type].limit;
                CONFIG_LINII[groupId].machines[type].desc  = cfg[type].desc;
            });

            // Zapisz tryb do Firebase
            window.SHARED_DATA['homo-mode-' + groupId] = mode;
            db.ref('monitorData/homo-mode-' + groupId).set(mode);

            // Odśwież etykiety w DOM
            const types = ['master', 'sub1', 'sub2'];
            types.forEach(type => {
                const m = CONFIG_LINII[groupId].machines[type];
                const labelEl = document.querySelector(`#box-${groupId}-${type} .t-label`);
                const descEl  = document.querySelector(`#box-${groupId}-${type} .machine-desc`);
                if (labelEl) labelEl.innerText = `${m.label} (${m.limit}h)`;
                if (descEl)  descEl.innerText  = m.desc;
            });

            // Podświetl aktywną etykietę
            document.getElementById('label-homo-on-'  + groupId).classList.toggle('active',  isHomo);
            document.getElementById('label-homo-off-' + groupId).classList.toggle('active', !isHomo);

            updateAll();
        }

        function applyHomoMode(groupId, mode) {
            const cfg = CONFIG_A4[mode] || CONFIG_A4['bez'];
            ['master', 'sub1', 'sub2'].forEach(type => {
                CONFIG_LINII[groupId].machines[type].limit = cfg[type].limit;
                CONFIG_LINII[groupId].machines[type].desc  = cfg[type].desc;
            });

            const toggle = document.getElementById('homo-toggle-' + groupId);
            if (toggle) toggle.checked = (mode === 'bez');

            const labelOn  = document.getElementById('label-homo-on-'  + groupId);
            const labelOff = document.getElementById('label-homo-off-' + groupId);
            if (labelOn)  labelOn.classList.toggle('active',  mode === 'homo');
            if (labelOff) labelOff.classList.toggle('active', mode === 'bez');

            const types = ['master', 'sub1', 'sub2'];
            types.forEach(type => {
                const m = CONFIG_LINII[groupId].machines[type];
                const labelEl = document.querySelector(`#box-${groupId}-${type} .t-label`);
                const descEl  = document.querySelector(`#box-${groupId}-${type} .machine-desc`);
                if (labelEl) labelEl.innerText = `${m.label} (${m.limit}h)`;
                if (descEl)  descEl.innerText  = m.desc;
            });
        }

        const DNI_TYGODNIA = ['ND.', 'PN.', 'WT.', 'ŚR.', 'CZW.', 'PT.', 'SOB.'];

        function pad(n) { return n < 10 ? '0' + n : n; }

        function generateTimerBox(groupId, type) {
            const m = CONFIG_LINII[groupId].machines[type];
            const isMaster = type === 'master';
            return `
            <div class="timer-box ${type}" id="box-${groupId}-${type}">
                <div class="machine-desc">${m.desc}</div>
                <div class="t-label">${m.label} (${m.limit}h)</div>
                ${!isMaster ? `<input type="datetime-local" class="sub-date-input" id="sub-${groupId}-${type}" onchange="saveAndUpdate('sub-${groupId}-${type}')">` : '<div style="height:45px"></div>'}
                <div style="margin-top: auto;">
                    <div class="praca-do-wrapper">
                        <div class="praca-do-label">PRACA DO</div>
                        <div class="t-footer" id="f-${groupId}-${type}">-- --.-- --:--</div>
                    </div>
                    <div class="t-value" id="t-${groupId}-${type}">0D 00h 00m 00s</div>
                </div>
            </div>`;
        }

        function generateAll() {
            const wrapper = document.querySelector('.groups-grid-wrapper');
            let html = '';
            Object.keys(CONFIG_LINII).forEach(id => {
                const line = CONFIG_LINII[id];
                html += `
                <div class="group-container">
                    <div class="group-header">
                        <div class="group-title">${line.title}</div>
                        
                        <div class="main-start-wrapper">
                            <span class="main-start-label">Startuj Linię:</span>
                            <input type="datetime-local" class="main-date-input" id="main-${id}" onchange="saveAndUpdate('main-${id}')">
                        </div>

                        <button id="btn-toggle-${id}" class="reset-btn stop-btn" onclick="toggleLine(${id})">Wyłącz Linię</button>
                    </div>
                    <div class="timers-row">
                        ${generateTimerBox(id, 'master')}
                        ${generateTimerBox(id, 'sub1')}
                        ${generateTimerBox(id, 'sub2')}
                    </div>
                    ${id == 4 ? `
                    <div style="display:flex; justify-content:center; margin-top:18px;">
                        <div class="homo-toggle-wrapper">
                            <span class="homo-toggle-label active" id="label-homo-on-4">Z HOMO</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="homo-toggle-4" onchange="onHomoToggle(4)">
                                <span class="toggle-slider"></span>
                            </label>
                            <span class="homo-toggle-label" id="label-homo-off-4">BEZ HOMO</span>
                        </div>
                    </div>` : ''}
                </div>`;
            });
            wrapper.innerHTML = html;
        }

        window.SHARED_DATA = {};
        const firebaseConfig = { databaseURL: "https://dane-17dae-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function saveAndUpdate(id) {
            window.SHARED_DATA[id] = document.getElementById(id).value;
            updateAll();
        }

        function saveDataToFirebase() {
            db.ref('monitorData').set(window.SHARED_DATA).then(() => alert("Zapisano pomyślnie!"));
        }

        function toggleLine(groupId) {
            const currentStatus = window.SHARED_DATA['status-' + groupId] || 'active';
            
            if (currentStatus === 'active') {
                // ZATRZYMANIE LINII
                if(!confirm("Zatrzymać linię " + CONFIG_LINII[groupId].title + " i wyzerować czasy?")) return;
                
                window.SHARED_DATA['status-' + groupId] = 'stopped';
                
                // Zerowanie danych przy zatrzymaniu
                window.SHARED_DATA['main-' + groupId] = "";
                window.SHARED_DATA['sub-' + groupId + '-sub1'] = "";
                window.SHARED_DATA['sub-' + groupId + '-sub2'] = "";
                
                // Czyścimy inputy wizualnie
                const mainInput = document.getElementById('main-' + groupId);
                if(mainInput) mainInput.value = "";

                if(document.getElementById(`sub-${groupId}-sub1`)) document.getElementById(`sub-${groupId}-sub1`).value = "";
                if(document.getElementById(`sub-${groupId}-sub2`)) document.getElementById(`sub-${groupId}-sub2`).value = "";
            } else {
                // START LINII
                window.SHARED_DATA['status-' + groupId] = 'active';
            }

            saveDataToFirebase();
            updateAll();
        }

        function updateAll() {
            Object.keys(CONFIG_LINII).forEach(groupId => {
                // --- LOGIKA STATUSU LINII ---
                const status = window.SHARED_DATA['status-' + groupId] || 'active';
                const container = document.querySelectorAll('.group-container')[groupId-1];
                const btn = document.getElementById('btn-toggle-' + groupId);

                // Aktualizacja wyglądu kafelka i przycisku
                if (status === 'stopped') {
                    container.classList.add('line-stopped');
                    if(btn) {
                        btn.innerText = "Startuj Linię";
                        btn.className = "reset-btn start-btn";
                    }
                    const mainInput = document.getElementById('main-' + groupId);
                    if(mainInput) mainInput.disabled = true;
                } else {
                    container.classList.remove('line-stopped');
                    if(btn) {
                        btn.innerText = "Wyłącz Linię";
                        btn.className = "reset-btn stop-btn";
                    }
                    const mainInput = document.getElementById('main-' + groupId);
                    if(mainInput) mainInput.disabled = false;
                }

                // --- LOGIKA LICZNIKÓW ---
                const startVal = window.SHARED_DATA['main-' + groupId];
                ['master', 'sub1', 'sub2'].forEach(type => {
                    const m = CONFIG_LINII[groupId].machines[type];
                    const tEl = document.getElementById(`t-${groupId}-${type}`);
                    const fEl = document.getElementById(`f-${groupId}-${type}`);
                    const box = document.getElementById(`box-${groupId}-${type}`);

                    if (!startVal) {
                        tEl.innerText = "--D --h --m --s";
                        fEl.innerText = "-- --.-- --:--";
                        box.classList.remove('overdue');
                        return;
                    }

                    const subVal = window.SHARED_DATA[`sub-${groupId}-${type}`];
                    const startTime = (type !== 'master' && subVal) ? new Date(subVal) : new Date(startVal);
                    const target = new Date(startTime.getTime() + (m.limit * 3600000));
                    const diff = target - new Date();

                    const dzienTyg = DNI_TYGODNIA[target.getDay()];
                    fEl.innerText = `${dzienTyg} ${pad(target.getDate())}.${pad(target.getMonth()+1)} ${pad(target.getHours())}:${pad(target.getMinutes())}`;
                    
                    if (diff <= 0) {
                        tEl.innerText = "MYCIE";
                        box.classList.add('overdue');
                    } else {
                        box.classList.remove('overdue');
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const min = Math.floor((diff % 3600000) / 60000);
                        const sec = Math.floor((diff % 60000) / 1000);
                        tEl.innerText = `${d}D ${pad(h)}h ${pad(min)}m ${pad(sec)}s`;
                    }
                });
            });
        }

        generateAll();
        db.ref('monitorData').on('value', snap => {
            window.SHARED_DATA = snap.val() || {};
            Object.keys(window.SHARED_DATA).forEach(key => {
                const el = document.getElementById(key);
                if(el && !key.startsWith('status-') && !key.startsWith('homo-mode-')) el.value = window.SHARED_DATA[key];
            });
            // Przywróć tryb homo dla linii A4
            const savedMode = window.SHARED_DATA['homo-mode-4'] || 'homo';
            applyHomoMode(4, savedMode);
            updateAll();
        });
        setInterval(updateAll, 1000);
    </script>
</body>
</html>
