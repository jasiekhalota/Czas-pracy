<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor czasu pracy lini PET</title>
	
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-96x96.png" />
    
    <meta name="apple-mobile-web-app-title" content="Licznik" />
    <link rel="manifest" href="site.webmanifest" />

    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Rozkładamy elementy: góra - środek (pusty) - dół */
            justify-content: space-between; 
            text-align: center;
            padding: 100px 0; /* Odstęp od krawędzi ekranu */
            box-sizing: border-box;

            /* Logo na środku */
            background-image: url('logo_tlo.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px; 
        }

        h1 { 
            color: #ffffff; 
            font-size: 2.5rem;
            max-width: 900px;
            line-height: 1.2;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0;
            
            /* Przywrócenie centrowania */
            display: block;
            width: 100%;
            
            /* Obwódka liter */
            -webkit-text-stroke: 1px black;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .menu-container {
            display: flex;
            gap: 30px;
            /* Przyciski zawsze na dole dzięki space-between w body */
            margin-top: auto; 
            padding-top: 100px; /* Dodatkowy dystans od środka (logo) */
        }

        .menu-btn {
            width: 260px; 
            height: 160px;
            padding: 20px;
            font-size: 1.4rem; 
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            background-color: #1B365D;
            border: 2px solid #333;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-view { border-bottom: 6px solid #48bb78; }
        .btn-edit { border-bottom: 6px solid #f56565; }

        .menu-btn:hover {
            transform: translateY(-8px);
            background-color: #254a80;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7);
        }

        .btn-icon { font-size: 2.2rem; }

        @media (max-width: 750px) {
            .menu-container { flex-direction: column; gap: 20px; }
            .menu-btn { width: 240px; height: 130px; }
            h1 { font-size: 1.6rem; padding: 0 20px; }
            body { padding: 30px 0; }
            background-size: 350px; /* Mniejsze logo na komórki */
        }
    </style>
</head>
<body>

    <h1>Monitor czasu pracy <br>linii PET</h1>

    <div class="menu-container">
        <button class="menu-btn btn-view" onclick="goView()">
            <span class="btn-icon">👁</span>
            PODGLĄD
        </button>

        <button class="menu-btn btn-edit" onclick="goEdit()">
            <span class="btn-icon">✎</span>
            EDYCJA
        </button>
    </div>

    <script>
        function goView() {
            // Przejście do pliku podglądu
            window.location.href = 'licznik_view.html';
        }

        function goEdit() {
            // Monit o hasło
            const password = prompt("Podaj hasło dostępu:");
            const correctPassword = "12qw";

            if (password === correctPassword) {
                // Przejście do pliku edycji
                window.location.href = 'licznik.html';
            } else if (password !== null) {
                // Informacja o błędnym haśle (tylko jeśli użytkownik nie kliknął 'Anuluj')
                alert("Podaj prawidłowe hasło");
            }
        }
    </script>

</body>
</html>
