<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor czasu pracy lini PET</title>
	
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-96x96.png" />
    
    <meta name="apple-mobile-web-app-title" content="Licznik" />
    <meta name="theme-color" content="#1B365D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="site.webmanifest" />

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Rozkładamy elementy: góra - środek (pusty) - dół */
            justify-content: space-between; 
            text-align: center;
            padding: 100px 0; /* Odstęp od krawędzi ekranu */
            box-sizing: border-box;

            /* Logo na środku */
            background-image: url('logo_tlo.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px; 
        }

        h1 { 
            color: #ffffff; 
            font-size: 2.5rem;
            max-width: 900px;
            line-height: 1.2;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0;
            
            /* Przywrócenie centrowania */
            display: block;
            width: 100%;
            
            /* Obwódka liter */
            -webkit-text-stroke: 1px black;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .menu-container {
            display: flex;
            gap: 30px;
            /* Przyciski zawsze na dole dzięki space-between w body */
            margin-top: auto; 
            padding-top: 100px; /* Dodatkowy dystans od środka (logo) */
        }

        .menu-btn {
            width: 260px; 
            height: 160px;
            padding: 20px;
            font-size: 1.4rem; 
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            background-color: #1B365D;
            border: 2px solid #333;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-view { border-bottom: 6px solid #48bb78; }
        .btn-edit { border-bottom: 6px solid #f56565; }

        .menu-btn:hover {
            transform: translateY(-8px);
            background-color: #254a80;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7);
        }

        .btn-icon { font-size: 2.2rem; }


        .stats-bar {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .stat-item .stat-val {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; background: #48bb78;
                    box-shadow: 0 0 6px #48bb78; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        #btn-install {
            display: none;
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            background-color: #2d6a4f;
            border: 2px solid #48bb78;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            gap: 8px;
        }
        #btn-install:hover {
            background-color: #40916c;
            transform: translateY(-3px);
        }

        @media (max-width: 750px) {
            .menu-container { flex-direction: column; gap: 20px; }
            .menu-btn { width: 240px; height: 130px; }
            h1 { font-size: 1.6rem; padding: 0 20px; }
            body { padding: 30px 0; }
            background-size: 350px; /* Mniejsze logo na komórki */
        }
    </style>
</head>
<body>

    <h1>Monitor czasu pracy <br>linii PET</h1>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-dot"></div> Online: <span class="stat-val" id="stat-online">—</span></div>
        <div class="stat-item">👁 Dzisiaj: <span class="stat-val" id="stat-today">—</span></div>
        <div class="stat-item">📅 Miesiąc: <span class="stat-val" id="stat-month">—</span></div>
    </div>

    <button id="btn-install" onclick="installApp()">📲 Zainstaluj aplikację</button>

    <div class="menu-container">
        <button class="menu-btn btn-view" onclick="goView()">
            <span class="btn-icon">👁</span>
            PODGLĄD
        </button>

        <button class="menu-btn btn-edit" onclick="goEdit()">
            <span class="btn-icon">✎</span>
            EDYCJA
        </button>
    </div>

    <script>
        function goView() {
            // Przejście do pliku podglądu
            window.location.href = 'licznik_view.html';
        }

        function goEdit() {
            // Monit o hasło
            const password = prompt("Podaj hasło dostępu:");
            const correctPassword = "12qw";

            if (password === correctPassword) {
                // Przejście do pliku edycji
                window.location.href = 'licznik.html';
            } else if (password !== null) {
                // Informacja o błędnym haśle (tylko jeśli użytkownik nie kliknął 'Anuluj')
                alert("Podaj prawidłowe hasło");
            }
        }
    </script>


    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        let deferredPrompt;

        // --- PWA diagnostyka ---
        const diag = document.getElementById('pwa-diag');

        // 1. Sprawdź SW
        if (!('serviceWorker' in navigator)) {
            diag.innerHTML += '❌ Service Worker: nieobsługiwany<br>';
        } else {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => diag.innerHTML += '✅ Service Worker: zarejestrowany<br>')
                .catch(err => diag.innerHTML += '❌ Service Worker: błąd — ' + err + '<br>');
        }

        // 2. Sprawdź manifest
        fetch('./site.webmanifest')
            .then(r => r.ok
                ? diag.innerHTML += '✅ Manifest: dostępny<br>'
                : diag.innerHTML += '❌ Manifest: błąd HTTP ' + r.status + '<br>')
            .catch(() => diag.innerHTML += '❌ Manifest: niedostępny<br>');

        // 3. Sprawdź HTTPS
        if (location.protocol === 'https:') {
            diag.innerHTML += '✅ HTTPS: tak<br>';
        } else {
            diag.innerHTML += '❌ HTTPS: brak (wymagane!)<br>';
        }

        // 4. Nasłuchuj na beforeinstallprompt
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            diag.innerHTML += '✅ beforeinstallprompt: odpalił!<br>';
            document.getElementById('btn-install').style.display = 'inline-flex';
        });

        // 5. Czy już zainstalowane?
        if (window.matchMedia('(display-mode: standalone)').matches) {
            diag.innerHTML += 'ℹ️ Aplikacja już działa jako PWA (zainstalowana)<br>';
        } else {
            diag.innerHTML += 'ℹ️ Tryb: przeglądarka (nie standalone)<br>';
        }

        function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(result => {
                if (result.outcome === 'accepted') {
                    document.getElementById('btn-install').style.display = 'none';
                }
                deferredPrompt = null;
            });
        }

        window.addEventListener('appinstalled', () => {
            document.getElementById('btn-install').style.display = 'none';
            diag.innerHTML += '✅ Zainstalowano!<br>';
        });
    </script>

    <script>
        // ---- FIREBASE STATS ----
        const fbCfg = { databaseURL: "https://dane-17dae-default-rtdb.europe-west1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(fbCfg);
        const statsDb = firebase.database();

        const PAGE = 'index';
        const uid = Math.random().toString(36).slice(2);
        const now = new Date();
        const todayKey = now.toISOString().slice(0,10).replace(/-/g,'');
        const monthKey = now.toISOString().slice(0,7).replace(/-/g,'');

        // Presence
        const presRef = statsDb.ref('presence/' + uid);
        presRef.set({ page: PAGE, ts: Date.now() });
        presRef.onDisconnect().remove();
        setInterval(() => presRef.set({ page: PAGE, ts: Date.now() }), 20000);

        // Count online
        statsDb.ref('presence').on('value', snap => {
            const val = snap.val() || {};
            const cutoff = Date.now() - 60000;
            const online = Object.values(val).filter(v => v.ts > cutoff).length;
            document.getElementById('stat-online').textContent = online;
        });

        // Increment visits
        statsDb.ref('visits/day/' + todayKey).transaction(v => (v || 0) + 1);
        statsDb.ref('visits/month/' + monthKey).transaction(v => (v || 0) + 1);

        // Read visit counts
        statsDb.ref('visits/day/' + todayKey).on('value', s => {
            document.getElementById('stat-today').textContent = s.val() || 0;
        });
        statsDb.ref('visits/month/' + monthKey).on('value', s => {
            document.getElementById('stat-month').textContent = s.val() || 0;
        });
    </script>
</body>
</html>
