<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor czasu pracy urządzeń lini produkcyjnych Aseptic PET</title>
    <style>
        /* --- STYLIZACJA SPÓJNA Z LICZNIKIEM --- */
        body {
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 { 
            color: #ffffff; 
            margin-bottom: 60px;
            font-size: 2.8rem;
            max-width: 800px;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        .menu-container {
            display: flex;
            gap: 40px;
        }

        .menu-btn {
            width: 250px;
            padding: 30px;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            background-color: #1B365D; /* Kolor błękitny z Twoich kafelków */
            border: 2px solid #333;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* Kolory specyficzne dla przycisków */
        .btn-view {
            border-bottom: 8px solid #48bb78; /* Zielony jak Master */
        }

        .btn-edit {
            border-bottom: 8px solid #f56565; /* Czerwony jak Sub */
        }

        .menu-btn:hover {
            transform: translateY(-10px);
            background-color: #254a80;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .menu-btn:active {
            transform: translateY(-2px);
        }

        .btn-icon {
            font-size: 2.5rem;
        }

        /* Responsywność */
        @media (max-width: 700px) {
            .menu-container { flex-direction: column; }
            h1 { font-size: 1.8rem; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <h1>Monitor czasu pracy urządzeń lini produkcyjnych Aseptic PET</h1>

    <div class="menu-container">
        <button class="menu-btn btn-view" onclick="goView()">
            <span class="btn-icon">👁</span>
            PODGLĄD
        </button>

        <button class="menu-btn btn-edit" onclick="goEdit()">
            <span class="btn-icon">✎</span>
            EDYCJA
        </button>
    </div>

    <script>
        function goView() {
            // Przejście do pliku podglądu
            window.location.href = 'licznik_view.html';
        }

        function goEdit() {
            // Monit o hasło
            const password = prompt("Podaj hasło dostępu:");
            const correctPassword = "12qw";

            if (password === correctPassword) {
                // Przejście do pliku edycji
                window.location.href = 'licznik.html';
            } else if (password !== null) {
                // Informacja o błędnym haśle (tylko jeśli użytkownik nie kliknął 'Anuluj')
                alert("Podaj prawidłowe hasło");
            }
        }
    </script>

</body>
</html>
